# GNU Radio "ZMQ PUB Sink" with complex float samples (issue #101).
# In GNU Radio: Type = complex, Pass Tags = off. The sink sends raw samples:
# no header, so the sample rate and the frequency come from [stream].
# With a Key (topic) in the sink, the message has two frames: the key, then
# the samples; "frames = last" reads the samples in both cases.

[format]
name        = GNU Radio PUB Sink (cf32)
description = Raw complex float samples from a GNU Radio ZMQ PUB Sink, tags off

[socket]
type      = sub
transport = tcp
mode      = connect
address   = 127.0.0.1:5555   # the sink's address, e.g. tcp://*:5555 in GNU Radio
topic     =                  # the sink's Key; empty = all messages
frames    = last

[header]
bytes = 0

[samples]
format = cf32
endian = little
order  = iq

[stream]
rate = 2e6      # set to the rate of the flowgraph
fc   = 100e6    # shown on the axis; the sink does not send it
