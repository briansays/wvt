# The built-in wvt format, written as a file (issue #101): the data messages
# with ci16 samples only. The built-in format "wvt" reads all messages (cu8,
# ci16 and cf32, the info and end messages); this file is a template and a
# check of the file format. Header layout: src/net/zmq_wire.h.

[format]
name        = wvt stream as a file (ci16)
description = The wvt stream, ci16 data messages only

[socket]
type      = dish
transport = udp
mode      = bind
group     = wvt

[header]
bytes         = 64
match.magic   = "WVTZ" @ 0
match.version = u8 @ 4 == 1
match.kind    = u8 @ 5 == 1     # data
match.format  = u8 @ 6 == 2     # ci16
count         = u32le @ 12
index         = u64le @ 16
fc            = f64le @ 24
rate          = f64le @ 32
gain          = f64le @ 40
time_ns       = u64le @ 48

[samples]
format = ci16
endian = little
order  = iq
