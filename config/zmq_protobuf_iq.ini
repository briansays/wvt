# A Protobuf message format (issue #118). The schema is protobuf_iq.proto in
# this folder: an Envelope with a oneof of a Status or IqData. wvt names the
# fields by their numbers; 2.6 is field 6 (samples) of field 2 (iq).

[format]
name        = Protobuf IQ (example)
description = Envelope { IqData iq = 2 } with packed float samples, see protobuf_iq.proto
encoding    = protobuf

[socket]
type      = sub
transport = tcp
mode      = connect
address   = 127.0.0.1:5558

[protobuf]
match.iq = present 2      # only the messages with IqData; a Status is ignored
seq      = uint64 2.1     # message counter
fc       = double 2.2
rate     = double 2.3
gain     = float 2.4
time_ns  = fixed64 2.5
samples  = float 2.6      # I, Q, I, Q ...

# A wvt built with WVT_WITH_PROTOBUF can use the names of the .proto file
# in place of the numbers and types:
#   proto    = protobuf_iq.proto
#   message  = Envelope
#   match.iq = present iq
#   seq      = iq.seq
#   rate     = iq.rate_hz
#   samples  = iq.samples
