# A template for a format with a binary header (issue #101). Copy it to
# zmq_<name>.ini and change it for your source.
#
# The message: 32 header bytes, then big-endian ci16 samples.
#   0  "ABCD"   magic
#   4  u8       message type, 1 = samples
#   8  u32 BE   message counter
#  12  f64 BE   center frequency, Hz
#  20  u32 BE   sample rate, kS/s
#  24  u64 BE   time of the first sample, ns since 1970

[format]
name        = Example header (ci16 BE)
description = 32-byte header, then big-endian ci16 samples

[socket]
type      = sub
transport = tcp
mode      = connect
address   = 127.0.0.1:5557
topic     =
frames    = last
max_bytes = 1048576

[header]
bytes       = 32
match.magic = "ABCD" @ 0         # a message that does not match is ignored
match.type  = u8 @ 4 == 1
seq         = u32be @ 8          # message counter (or: index = u64be @ 8, a sample counter)
fc          = f64be @ 12
rate        = u32be @ 20 * 1e3   # the field is in kS/s
time_ns     = u64be @ 24
# also: gain = TYPE @ OFFSET, count = TYPE @ OFFSET (samples in the message)

[samples]
format = ci16
endian = big
order  = iq

[stream]
gain = 0        # the header has no gain
