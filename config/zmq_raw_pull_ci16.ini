# Raw ci16 samples on a ZMQ PUSH socket, received with PULL (issue #101).
# No header: the sample rate and the frequency come from [stream].

[format]
name        = Raw ci16 (PULL)
description = Raw little-endian ci16 samples from a ZMQ PUSH socket

[socket]
type      = pull
transport = tcp
mode      = connect
address   = 127.0.0.1:5556

[header]
bytes = 0

[samples]
format = ci16
endian = little
order  = iq

[stream]
rate = 1e6
fc   = 433.92e6
